name: Metrics

on:
  # Refresh every day at 01:00 UTC (08:00 WIB)
  schedule:
    - cron: "0 1 * * *"
  # Manual run from the Actions tab
  workflow_dispatch:
  # Regenerate when the workflow itself changes
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1. Isometric commit calendar (full year, wide render)
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 6%, 8%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 2. Language activity (most-used + recently-used)
      #    repositories_* widened so private repos are included in the stats
      - name: Language activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 4%, 6%
          repositories_affiliations: owner, collaborator
          repositories: 100
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 12
          plugin_languages_ignored: >-
            html, css, tex, batchfile, shell, makefile
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 1000
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: no

      # 3. People (followers / following / stargazers)
      - name: People
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/people.svg
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 4%, 6%
          plugin_people: yes
          plugin_people_limit: 32
          plugin_people_size: 42
          plugin_people_types: followers, following, stargazers
          plugin_people_identicons: no

      # 4. Recent coding habits (isolated so a failure cannot break other panels)
      - name: Coding habits
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/habits.svg
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 4%, 6%
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_trim: yes

      # 5. Achievements (isolated so a failure cannot break other panels)
      - name: Achievements
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 4%, 6%
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C

  # Repository license panels.
  # plugin_licenses only works with template: repository, so one panel per repo.
  # NOTE: plugin_licenses_setup is intentionally NOT used. It made every panel
  # fail with "Unexpected error". Without it the panel still reports the repo
  # license plus permissions/limitations/conditions, but dependency licenses
  # stay at 0 dependencies.
  # needs: metrics + max-parallel: 1 keeps commits to main sequential.
  licenses:
    runs-on: ubuntu-latest
    needs: metrics
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - repo: Biomodelling-Course-Projects-and-Reports
            slug: biomodelling
          - repo: Biomedical-Signal-Processing-PSB-Course-Projects-and-Reports
            slug: psb
          - repo: Fundamental-of-Intelligent-System-DSC-Course-Projects-and-Reports
            slug: dsc
          - repo: Non-Stationary-Signal-Analysis-ASN-Course-Projects-and-Reports
            slug: asn
          - repo: Biomedical-Image-Processing-PCM-Projects-and-Reports
            slug: pcm
          - repo: Multimodal-Biomedical-Data-Analysis-MBDA-Projects-and-Reports
            slug: mbda
          - repo: RBC-UNet-Plus-Plus
            slug: rbc-unet
          - repo: Intro-to-Python
            slug: intro-python
          - repo: General-Methods-in-Machine-Learning-using-Python-and-R-
            slug: ml-general
          - repo: CyberArena-CTF-Tutorial
            slug: cyberarena
          - repo: identis-virtual-stylist
            slug: identis
          - repo: Yet-to-be-JoJo-s-RPG-Game-
            slug: jojo-rpg
    steps:
      - name: License panel for ${{ matrix.repo }}
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/licenses/${{ matrix.slug }}.svg
          template: repository
          repo: ${{ matrix.repo }}
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 4%, 6%
          plugin_licenses: yes
          plugin_licenses_ratio: yes
