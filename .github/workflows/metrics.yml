name: Metrics

on:
  # Refresh every day at 01:00 UTC (08:00 WIB)
  schedule:
    - cron: "0 1 * * *"
  # Manual run from the Actions tab
  workflow_dispatch:
  # Regenerate when the workflow itself changes
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # 1. Isometric commit calendar (full year, wide render)
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/isocalendar.svg
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 6%, 8%
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # 2. Language activity (most-used + recently-used)
      - name: Language activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/languages.svg
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 4%, 6%
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 12
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 90
          plugin_languages_recent_load: 400
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: no

      # 3. People (followers / following / stargazers)
      - name: People
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/people.svg
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 4%, 6%
          plugin_people: yes
          plugin_people_limit: 32
          plugin_people_size: 42
          plugin_people_types: followers, following, stargazers
          plugin_people_identicons: no

      # 4. Repository license (repository template, needs a LICENSE file)
      - name: Repository license
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/licenses.svg
          template: repository
          repo: ZinniXX004
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 4%, 6%
          plugin_licenses: yes
          plugin_licenses_ratio: yes

      # 5. Recent coding habits (isolated so a failure cannot break other panels)
      - name: Coding habits
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/habits.svg
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 4%, 6%
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: classic
          plugin_habits_from: 100
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_trim: yes

      # 6. Achievements (isolated so a failure cannot break other panels)
      - name: Achievements
        uses: lowlighter/metrics@latest
        continue-on-error: true
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ZinniXX004
          filename: metrics/achievements.svg
          base: ""
          config_timezone: Asia/Jakarta
          config_display: large
          config_padding: 4%, 6%
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
